[project]
name = "daoufys-voice-agent"
version = "1.0.0"
description = "DAOUFYS TRANSIT — Voice AI Receptionist (Darija/French) with LiveKit + Hermes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents==1.8.9",
    "livekit-plugins-openai==1.8.9",
    "livekit-plugins-deepgram==1.8.9",
    "livekit-plugins-cartesia==1.8.9",
    "livekit-plugins-silero==1.8.9",
    "aiohttp>=3.10,<4",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
mcp = ["livekit-agents[mcp]==1.8.9"]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.8",
    "ruff==0.6.0",
    "black==24.10.0",
]



[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"